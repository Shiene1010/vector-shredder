<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vector Tycoon: Platform Monitoring Center</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="phone-wrapper">
    <!-- 2D 픽셀 파티클 레이어 -->
    <canvas id="shred-canvas"></canvas>

    <!-- 1. TOP HUD SECTION (상단 전광판) -->
    <div class="top-hud">
      <div class="hud-panel red-alert">
        <div class="hud-title">★ 동네 민심</div>
        <div class="hud-value" id="stat-mental">24%</div>
        <div class="hud-sub">
          <span>인도 배달사고율</span>
          <span id="stat-accident" style="color: var(--neon-red); font-weight: bold;">45%</span>
        </div>
      </div>
      <div class="hud-panel blue-alert">
        <div class="hud-title">👥 손님 상태</div>
        <div class="hud-value" id="stat-shield">55%</div>
        <div class="hud-sub">
          <span>단골 손님 수</span>
          <span id="stat-customers" style="color: var(--neon-blue); font-weight: bold;">310</span>
        </div>
      </div>
      <div class="hud-panel green-alert">
        <div class="hud-title">💰 카페 금고</div>
        <div class="hud-value" id="stat-noise">8%</div>
        <div class="hud-sub">
          <span>누적 시너지 수익</span>
          <span id="stat-revenue" style="color: var(--neon-green); font-weight: bold;">$0</span>
        </div>
      </div>
    </div>

    <!-- 2. CENTER AREA (중앙 스플릿 스크린) -->
    <div class="center-area">
      <!-- 좌측: 관제 그리드 맵 -->
      <div class="map-container" id="map-frame">
        <svg class="vector-svg" id="vector-svg-routes"></svg>
        
        <div class="map-node" style="top: 30%; left: 35%;">
          🏠<span class="label">단골집</span>
        </div>
        <div class="map-node" style="top: 55%; left: 25%;">
          ☕<span class="label">카페 본점</span>
        </div>

        <!-- 동적 에이전트(라이더, 보행자) 풀 -->
        <div id="dynamic-agents"></div>
      </div>

      <!-- 우측: 이슈 로그 터미널 -->
      <div class="terminal-container">
        <div class="terminal-header">🤖 ISSUE LOG TERMINAL</div>
        <div class="log-stream" id="log-stream-box"></div>
      </div>
    </div>

    <!-- 3. BOTTOM CONTROL PANEL (하단 제어 컴포넌트) -->
    <div class="bottom-control">
      <div class="shred-btn-container">
        <button class="shred-btn" id="btn-shred">텍스트 파쇄 [HOLD]</button>
      </div>

      <!-- 회복 에너지 바 -->
      <div class="energy-box">
        <div class="energy-label">⚙️ CRITICAL RECOVERY ENERGY</div>
        <div class="energy-bar-bg">
          <div class="energy-bar-fill" id="energy-fill"></div>
        </div>
      </div>

      <!-- 인프라 업그레이드 & 영수증 슬롯 -->
      <div class="bottom-row">
        <div class="upgrade-grid">
          <button class="btn-upgrade">
            <span class="icon">☕</span>
            <span>커피머신</span>
            <span class="lv">Lv.1</span>
          </button>
          <button class="btn-upgrade">
            <span class="icon">🛵</span>
            <span>배달오토바이</span>
            <span class="lv">Lv.1</span>
          </button>
          <button class="btn-upgrade">
            <span class="icon">🛣️</span>
            <span>인도안전구역</span>
            <span class="lv">INFRA</span>
          </button>
        </div>

        <!-- 영지식 증명 쿠폰 지갑 -->
        <div class="zkp-receipt-box" id="zkp-box">
          <div class="zkp-title">ZKP WALLET</div>
          <div class="zkp-status" id="zkp-text">쿠폰 준비중</div>
          <div style="font-size: 5px; color: #aaa; font-family: monospace; transform: scale(0.95); margin-top: 2px;">HASH:0x7F4C...</div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
