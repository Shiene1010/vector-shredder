<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vector Tycoon: Platform Monitoring Center</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 메인 관제 프레임 (사고율 폭등 시 critical-alert 클래스 동적 부여) -->
  <div class="phone-wrapper" id="main-container">
    
    <!-- 보셀 입자가 소용돌이치며 흡입되는 2D 벡터 이펙트용 캔버스 (Z-Index: 20) -->
    <canvas id="shred-canvas"></canvas>

    <!-- 1. TOP SEMANTIC HUD (실시간 시스템 전광판 스탯 대시보드) -->
    <div class="top-hud">
      <div class="hud-panel red-alert">
        <div class="hud-title">★ 동네 민심</div>
        <div class="hud-value" id="stat-mental">24%</div>
        <div class="hud-sub">
          인도 배달사고율 <span id="stat-accident" style="color: var(--neon-red); font-weight: bold;">45%</span>
        </div>
      </div>
      
      <div class="hud-panel blue-alert">
        <div class="hud-title">👥 손님 상태</div>
        <div class="hud-value" id="stat-shield">55%</div>
        <div class="hud-sub">
          단골 손님 수 <span id="stat-customers" style="color: var(--neon-blue); font-weight: bold;">310</span>
        </div>
      </div>
      
      <div class="hud-panel green-alert">
        <div class="hud-title">💰 카페 금고</div>
        <div class="hud-value" id="stat-noise">8%</div>
        <div class="hud-sub">
          시너지 수익 <span id="stat-revenue" style="color: var(--neon-green); font-weight: bold;">$0</span>
        </div>
      </div>
    </div>

    <!-- 2. FULLSCREEN GRID VIEWPORT (중앙 통합 관제 시뮬레이터 공간) -->
    <div class="viewport-area" id="viewport-frame">
      
      <!-- 3단계 파이프라인 관제 컨베이어 벨트 레일 (오염 침투 시 맥박 링 애니메이션) -->
      <div class="pipeline-belt">
        <div class="belt-station active" id="station-ingest">
          <div class="pulse-ring"></div>
          <span>주문 접수부</span>
        </div>
        <div class="belt-station" id="station-brew">
          <div class="pulse-ring" style="animation-delay: 0.5s;"></div>
          <span>카페 제조부</span>
        </div>
        <div class="belt-station" id="station-dispatch">
          <div class="pulse-ring" style="animation-delay: 1s;"></div>
          <span>라이더 배달부</span>
        </div>
      </div>

      <!-- 물리 엔진 공간을 주행하는 실시간 라이더 노드 에이전트 풀 -->
      <div id="rider-agents-pool"></div>

      <!-- 4대 오염 데이터 카드(갑질주문, 악질업주, 보도주행, 악평리뷰) 실시간 브래킷 오버레이 -->
      <div class="cards-overlay" id="pollution-cards-container"></div>

      <!-- 반투명 미니멀 메인프레임 시스템 로그 터미널 인터페이스 -->
      <div class="terminal-overlay">
        <div class="log-stream" id="log-stream-box"></div>
      </div>

    </div>

    <!-- 3. SOLID BOTTOM CONTROL CONSOLE (하단 제어 콘솔 기기 패널) -->
    <div class="bottom-console">
      
      <!-- 보셀 입자 타격 피드백 및 햅틱 연동 파쇄 트리거 버튼 -->
      <div class="shred-btn-container">
        <button class="shred-trigger" id="btn-shred">텍스트 파쇄 [HOLD TO ABSORB]</button>
      </div>

      <!-- 시스템 안정도 복구 에너지 바 레일 -->
      <div class="energy-rail">
        <div class="energy-text">⚙️ SYSTEM RECOVERY STABILITY SPEED</div>
        <div class="energy-bar-bg">
          <div class="energy-bar-fill" id="energy-fill"></div>
        </div>
      </div>

      <!-- 인프라 업그레이드 노드 랙 & 영지식 증명(ZKP) 보상 영수증 출력 기기 -->
      <div class="console-footer">
        <div class="infra-group">
          <button class="btn-infra" id="upgrade-machine">
            <span class="icon">☕</span>
            <span>커피머신</span>
            <span class="status">Lv.1</span>
          </button>
          <button class="btn-infra" id="upgrade-bike">
            <span class="icon">🛵</span>
            <span>배달바이크</span>
            <span class="status">Lv.1</span>
          </button>
          <button class="btn-infra" id="upgrade-safety">
            <span class="icon">🛣️</span>
            <span>인도안전구역</span>
            <span class="status">INFRA</span>
          </button>
        </div>

        <!-- 최종 안정화 해시 릴리즈 영수증 -->
        <div class="zkp-wallet-slip" id="zkp-box">
          <div class="zkp-title">ZKP VERIFIER</div>
          <div class="zkp-value" id="zkp-text">쿠폰 준비중</div>
          <div style="font-size: 4px; color: #888; font-family: monospace; text-align: center; margin-top: 1px;">PROOF_HASH:0x7F4C...</div>
        </div>
      </div>

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
